[workspace]
members = ["crates/core", "crates/platform", "crates/runtime", "crates/discovery", "crates/vault", "crates/vault-crypto", "crates/vault-storage"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
overflow-checks = true
