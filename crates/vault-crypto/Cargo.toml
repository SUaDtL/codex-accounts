[package]
name = "codex-accounts-vault-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "=0.10.1", default-features = false }
hkdf = { version = "=0.12.4", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }
getrandom = "=0.3.4"
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
