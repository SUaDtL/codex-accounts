[package]
name = "codex-accounts-vault-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
codex-accounts-core = { path = "../core" }
codex-accounts-vault = { path = "../vault" }
codex-accounts-vault-crypto = { path = "../vault-crypto" }
getrandom = "=0.3.4"
sha2 = { version = "=0.10.9", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-collections = { version = "=0.3.2", default-features = false }
windows = { version = "=0.62.2", features = ["Storage_Provider", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_UI_Shell"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
