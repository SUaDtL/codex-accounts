<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accounts</title>
  <link rel="stylesheet" href="tray.css">
  <script src="tray.js" defer></script>
</head>
<body>
  <main class="flyout" aria-labelledby="tray-heading">
    <header class="flyout-header">
      <h1 id="tray-heading">Accounts</h1>
      <div class="header-actions">
        <button id="refresh-accounts" class="icon-button" type="button" aria-label="Refresh accounts" title="Refresh accounts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg>
        </button>
        <button id="open-accounts" class="icon-button" type="button" aria-label="Open Accounts" title="Open Accounts">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8M19 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
        </button>
      </div>
    </header>
    <section id="account-list" class="account-list" aria-live="polite" aria-busy="true"></section>
    <nav id="account-pages" class="account-pages" aria-label="Account pages" hidden>
      <button id="previous-page" class="page-button" type="button" aria-label="Previous accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <span id="page-label" aria-live="polite"></span>
      <button id="next-page" class="page-button" type="button" aria-label="Next accounts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </nav>
    <section id="loading-view" class="locked-view"><p>Loading accounts</p></section>
    <section id="locked-view" class="locked-view" hidden>
      <p id="locked-message">Open Accounts to unlock your saved accounts.</p>
      <button id="unlock-in-main" type="button" class="primary">Open Accounts</button>
    </section>
    <p id="tray-status" class="tray-status" role="status" aria-live="polite"></p>
  </main>
  <dialog id="trust-warning" aria-labelledby="trust-warning-title">
    <form method="dialog">
      <h2 id="trust-warning-title">Switch account?</h2>
      <p>This changes the account, not the local history or workspace. Existing conversations and files remain here. Continuing a conversation may send its context under the selected account.</p>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button id="confirm-switch" class="primary" value="confirm">Switch</button></div>
    </form>
  </dialog>
</body>
</html>
