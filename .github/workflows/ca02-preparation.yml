name: CA-02 source preparation (not validation)
on:
  push:
    branches: [feat/ca-02-native-discovery]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Acquire pinned source tooling
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Prepare offline tooling and source without compiling dependencies
        run: |
          tar -C "$HOME/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu" -czf pinned-rust-toolchain.tar.gz bin lib
          git bundle create ca02-review.bundle HEAD
          cargo generate-lockfile
          cargo fmt --all
          git diff --no-ext-diff -- crates > rustfmt.patch
          cargo vendor --locked --versioned-dirs .ca02-vendor
          git clone --depth 1 https://github.com/RustSec/advisory-db.git .ca02-advisories
          git -C .ca02-advisories rev-parse HEAD > advisory-db-commit.txt
          tar -czf dependency-review.tar.gz .ca02-vendor .ca02-advisories/crates advisory-db-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ca02-source-preparation
          path: |
            Cargo.lock
            rustfmt.patch
            dependency-review.tar.gz
            pinned-rust-toolchain.tar.gz
            ca02-review.bundle
          if-no-files-found: error
          retention-days: 1
