name: CA-03C developer preparation (not validation)
on:
  push:
    branches: [feat/ca-03c-vault-storage]
    paths: [.github/workflows/ca03c-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: rustup target add x86_64-pc-windows-msvc --toolchain 1.90.0
      - run: python3 tools/check_dependencies.py
      - run: cargo fetch --locked
      - name: Package exact public development inputs
        run: |
          mkdir -p prepared
          git rev-parse HEAD > prepared/source-commit.txt
          tar -czf prepared/windows-std.tar.gz -C "$HOME/.rustup/toolchains/1.90.0-x86_64-unknown-linux-gnu" lib/rustlib/x86_64-pc-windows-msvc
          tar -czf prepared/cargo-cache.tar.gz -C "$HOME/.cargo" registry
          cd prepared
          sha256sum windows-std.tar.gz cargo-cache.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca03c-windows-development-inputs
          path: prepared/
          retention-days: 1
          if-no-files-found: error
