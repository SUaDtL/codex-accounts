name: CA-04A source recovery (not validation)
on:
  push:
    branches: [feat/ca-04a-switch-journal]
    paths: [.github/workflows/ca04a-prepare.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preserve published source only
        shell: bash
        run: |
          set -euo pipefail
          mkdir ca04a-source
          git archive HEAD | gzip > ca04a-source/source.tar.gz
          git bundle create ca04a-source/source.bundle HEAD
          git rev-parse HEAD > ca04a-source/source-commit.txt
          cd ca04a-source
          sha256sum source.tar.gz source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca04a-source-recovery
          path: ca04a-source/
          if-no-files-found: error
          retention-days: 3
