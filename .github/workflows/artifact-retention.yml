name: Publish Preview and retain latest build

on:
  workflow_run:
    workflows: [Repository checks]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-artifact-retention
  cancel-in-progress: false

jobs:
  preview:
    name: Publish verifiable Windows Preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # Trusted default-branch tooling selects successful owner/main runs via the API.
      # Artifacts are parsed as data; none of their files or scripts are executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish the newest successful main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_preview.py

  retain:
    needs: [preview]
    # Do not prune a candidate needed to retry a failed publication.
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # Always the default branch, never the triggering PR revision.
      # This job reads API metadata only; it never downloads candidate artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove obsolete build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/retain_latest_build.py --apply
