name: Bootstrap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-python:
    name: Source integrity and inventory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record test interpreter
        run: python3 --version
      - name: Validate supplied source integrity
        run: |
          python3 tools/spec_index.py check
          python3 tools/check_dependencies.py
      - name: Run developer-tool tests
        run: python3 -m unittest discover -s tests/python -v

  rust-models:
    name: Rust models (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Acquire pinned development toolchain
        id: toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      # Separate steps preserve the review failure on Windows PowerShell too.
      # Dependency acquisition must not run after a failed lock review.
      - name: Validate reviewed dependency lock
        id: dependency_review
        run: python tools/check_dependencies.py
      - name: Acquire reviewed dependencies
        id: dependencies
        run: cargo fetch --locked
      - name: Record compiler
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      # Keep independent checks visible after a formatting/test failure.
      # Their failures still fail the job; do not use continue-on-error.
      - name: Test models without network
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: cargo test --workspace --all-targets --locked --offline
      - name: Lint models without network
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Native qualification boundary
        run: echo "Model checks only. No Desktop installation qualified; no OAuth, vault, or account mutation tested."
