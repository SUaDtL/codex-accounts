name: Bootstrap checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-python:
    name: Source integrity and inventory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record test interpreter
        run: python3 --version
      - name: Validate supplied source integrity
        run: python3 tools/spec_index.py check
      - name: Run developer-tool tests
        run: python3 -m unittest discover -s tests/python -v

  rust-models:
    name: Rust models (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Acquire pinned development toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Record compiler
        run: rustc --version --verbose
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test models without network
        run: cargo test --workspace --all-targets --locked --offline
      - name: Lint models without network
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Native qualification boundary
        run: echo "Model checks only. No Desktop installation qualified; no OAuth, vault, or account mutation tested."
