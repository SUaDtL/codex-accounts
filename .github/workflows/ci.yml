name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-and-python:
    name: Source integrity and inventory tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24; reviewed in ca-04b-native-review.md
        id: checkout
        with:
          persist-credentials: false
      - name: Record checked out commit and tree
        id: revision
        run: git log -1 --format="%H %T"
      - name: Validate supplied source integrity
        id: spec
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/spec_index.py check
      - name: Validate reviewed dependency lock
        id: dependency_review
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/check_dependencies.py
      - name: Validate workflow contract
        id: workflow_contract
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/ci_contract.py
      # The frozen-home adversary compiles and executes an actual offline Rust fixture.
      - name: Acquire pinned toolchain for execution-proof tests
        id: proof_toolchain
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.dependency_review.outcome == 'success' }}
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Run developer-tool tests
        id: python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.proof_toolchain.outcome == 'success' }}
        run: python3 -m unittest discover -s tests/python -v
      - name: Retain exact committed source evidence
        id: source_evidence
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/ci_source.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24; source evidence only
        id: source_upload
        if: ${{ !cancelled() && steps.source_evidence.outcome == 'success' }}
        with:
          name: source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ca-source-evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
      - name: Require every source check to execute successfully
        id: assess
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CI_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci_gate.py source

  rust-models:
    name: Rust (${{ matrix.os }}, ${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        profile: [debug, release]
    runs-on: ${{ matrix.os }}
    # Native crash/reopen evidence executes in both profiles on standard runners.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24; reviewed in ca-04b-native-review.md
        id: checkout
        with:
          persist-credentials: false
      - name: Record checked out commit and tree
        id: revision
        run: git log -1 --format="%H %T"
      # Review before any dependency acquisition. Keep native commands separate.
      - name: Validate reviewed dependency lock
        id: dependency_review
        run: python tools/check_dependencies.py
      - name: Acquire pinned development toolchain
        id: toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Restore compiler and dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0, Node 24
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ matrix.profile }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-
      - name: Acquire reviewed dependencies
        id: dependencies
        run: cargo fetch --locked
      - name: Record compiler
        id: compiler
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: rustc --version --verbose
      - name: Assert runner coverage lane
        id: host
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          CI_MATRIX_OS: ${{ matrix.os }}
          CI_PROFILE: ${{ matrix.profile }}
        run: python tools/ci_gate.py host
      - name: Check formatting
        id: format
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && matrix.profile == 'debug' }}
        run: cargo fmt --all -- --check
      # Cargo offline constrains acquisition, not sockets opened by build/test code.
      # No-fail-fast continues other test executables while retaining a failed exit.
      - name: Test workspace (Cargo offline)
        id: tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: python tools/ci_workspace_tests.py ${{ matrix.profile }}
      - name: Test documentation (Cargo offline)
        id: doctests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' && matrix.profile == 'debug' }}
        run: cargo test --workspace --doc --no-fail-fast --locked --offline
      - name: Build optimized targets (Cargo offline)
        id: release_build
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' && matrix.profile == 'release' }}
        run: cargo build --workspace --release --locked --offline
      - name: Verify Windows process supervision
        id: supervisor_tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' && matrix.os == 'windows-latest' }}
        run: python tools/check_windows_process.py
      - name: Verify named Windows native execution
        id: native_tests
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' && matrix.os == 'windows-latest' && steps.supervisor_tests.outcome == 'success' }}
        run: python tools/run_native_tests.py ${{ matrix.profile }}
      - name: Lint workspace (Cargo offline)
        id: clippy
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' && matrix.profile == 'debug' }}
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Package Windows executable and SBOM
        id: package
        if: ${{ success() && matrix.os == 'windows-latest' && matrix.profile == 'release' }}
        run: python tools/package_windows.py
      - name: Scan packaged dependency inventory
        id: package_scan
        if: ${{ success() && matrix.os == 'windows-latest' && matrix.profile == 'release' }}
        run: python tools/security_scan.py package
      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: package_upload
        if: ${{ success() && matrix.os == 'windows-latest' && matrix.profile == 'release' }}
        with:
          name: codex-accounts-windows-x64-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/windows-x64/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          include-hidden-files: false
      - name: Require every Rust check to execute successfully
        id: assess
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CI_RESULTS: ${{ toJSON(steps) }}
          CI_MATRIX_OS: ${{ matrix.os }}
          CI_PROFILE: ${{ matrix.profile }}
        run: python tools/ci_gate.py rust

  isolated-build:
    name: Linux network-isolated build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        id: checkout
        with:
          persist-credentials: false
      - name: Record checked out commit and tree
        id: revision
        run: git log -1 --format="%H %T"
      - name: Validate reviewed dependency lock
        id: dependency_review
        run: python tools/check_dependencies.py
      - name: Acquire pinned development toolchain
        id: toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - name: Acquire reviewed dependencies
        id: dependencies
        run: cargo fetch --locked
      - name: Rebuild and test without direct IP network access
        id: isolated
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' && steps.dependency_review.outcome == 'success' && steps.dependencies.outcome == 'success' }}
        run: python3 tools/ci_isolated.py
      - name: Require isolated execution and reviewed acquisition
        id: assess
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          CI_RESULTS: ${{ toJSON(steps) }}
        run: python3 tools/ci_gate.py isolated

  security:
    name: Security (${{ matrix.scanner }})
    strategy:
      fail-fast: false
      matrix:
        scanner: [trivy, opengrep]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Run pinned security scanner
        id: scan
        run: python3 tools/security_scan.py ${{ matrix.scanner }}
      - name: Upload security findings
        if: ${{ !cancelled() && hashFiles('reports/security/*.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4, Node 24
        with:
          sarif_file: reports/security/${{ matrix.scanner }}.sarif
          category: ${{ matrix.scanner }}
      - name: Upload secret findings separately
        if: ${{ !cancelled() && matrix.scanner == 'trivy' && hashFiles('reports/security/secrets.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4, Node 24
        with:
          sarif_file: reports/security/secrets.sarif
          category: trivy-secrets
      - name: Retain scanner report briefly
        if: ${{ !cancelled() && hashFiles('reports/security/*.sarif') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.scanner }}-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 2

  desktop-ui:
    name: Desktop UI behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false
      - name: Install locked browser test tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise bundled UI with synthetic IPC
        run: npm run test:ui
      - name: Retain UI screenshots briefly
        if: ${{ !cancelled() && hashFiles('reports/ui/**/*.png') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ui-${{ github.run_id }}
          path: reports/ui/
          if-no-files-found: error
          retention-days: 2

  ci-gate:
    name: CI gate
    needs: [source-and-python, rust-models, isolated-build, security, desktop-ui]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24; reviewed in ca-04b-native-review.md
        id: checkout
        with:
          persist-credentials: false
      - name: Require all prerequisite jobs to succeed
        id: assess
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: python3 tools/ci_gate.py jobs
