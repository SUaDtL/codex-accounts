name: CA-03B formatter preparation (not validation)
on:
  push:
    branches: [feat/ca-03b-vault-crypto]
    paths: [.github/workflows/ca03b-prepare.yml, 'crates/**']
permissions:
  contents: read
jobs:
  formatter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Emit formatter patch without compiling dependencies
        run: |
          cargo fmt --all
          mkdir ca03b-format
          git diff --binary > ca03b-format/fmt.patch
          git rev-parse HEAD > ca03b-format/source-commit.txt
          git archive --format=zip HEAD -o ca03b-format/source.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca03b-format
          path: ca03b-format/
          if-no-files-found: error
          retention-days: 3
